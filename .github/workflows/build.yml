name: Build and release.

# Windows x64 and Linux binaries. A pushed tag "v*" attaches them to a GitHub
# Release. The library caches are saved right after the libraries are built,
# so if a cold run hits the 6 hour job limit during the application build, the
# next run starts from the cached libraries.
on:
  push:
    branches:
      - tg-7.4.1
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      only_cache:
        description: "Only build and cache the libraries, skip the application."
        type: boolean
        default: false
      linux:
        description: "Also build the Linux binary (off by default)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest

    env:
      ONLY_CACHE: ${{ inputs.only_cache == true && 'true' || 'false' }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free disk space and prepare directories.
        shell: pwsh
        run: |
          # The Rust wallet engine and Qt need far more than a stock runner has free.
          $extra = @('C:\Android', 'C:\Program Files (x86)\Android', 'C:\Program Files\Android', 'C:\Julia', 'C:\Strawberry', 'C:\Program Files\PostgreSQL', 'C:\Program Files\MySQL', 'C:\Program Files\Microsoft SQL Server', 'C:\Program Files (x86)\Microsoft SQL Server', 'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk', 'C:\hostedtoolcache\windows\go', 'C:\hostedtoolcache\windows\Ruby')
          foreach ($path in $extra) {
            if (Test-Path $path) { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $path }
          }
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { "{0}: {1:N1} GB free" -f $_.Name, ($_.Free / 1GB) }
          $drive = (Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Sort-Object Free -Descending | Select-Object -First 1).Name
          "Building on drive ${drive}:"
          $root = "${drive}:\TBuild"
          New-Item -ItemType Directory -Force "$root\Libraries" | Out-Null
          cmd /c mklink /d "$env:GITHUB_WORKSPACE\TBuild" $root
          "TBUILD=$env:GITHUB_WORKSPACE\TBuild" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LibrariesPath=$env:GITHUB_WORKSPACE\TBuild\Libraries\win64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Short checkout directory.
        shell: bash
        # WHY: cl.exe fails with C1083 when an object path plus its temporary
        # suffix passes 260 characters, and the kimageformats paths are long.
        run: echo "REPO_NAME=hg" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            !${{ env.LibrariesPath }}\python311
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-libs-v3-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-libs-v3-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-libs-v3-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-qt6-v2-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-qt6-v2-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-qt6-v2-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/python311/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save libraries cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            !${{ env.LibrariesPath }}\python311
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-libs-v3-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save Qt cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-qt6-v2-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Python for plugins.
        if: env.ONLY_CACHE == 'false'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip -OutFile $zip
          $root = Join-Path $env:LibrariesPath 'python311'
          $embed = Join-Path $root 'embed'
          New-Item -ItemType Directory -Force $embed | Out-Null
          Expand-Archive -Path $zip -DestinationPath $embed -Force
          $installer = Join-Path $env:RUNNER_TEMP 'python-installer.exe'
          Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe -OutFile $installer
          $target = Join-Path $env:RUNNER_TEMP 'py311'
          Start-Process -FilePath $installer -Wait -ArgumentList '/quiet', "TargetDir=$target", 'Include_dev=1', 'Include_pip=1', 'Include_test=0', 'Include_launcher=0', 'InstallLauncherAllUsers=0', 'Shortcuts=0'
          New-Item -ItemType Directory -Force (Join-Path $root 'include'), (Join-Path $root 'libs') | Out-Null
          Copy-Item -Recurse -Force (Join-Path $target 'include\*') (Join-Path $root 'include')
          Copy-Item -Force (Join-Path $target 'libs\python311.lib') (Join-Path $root 'libs')
          $site = Join-Path $embed 'Lib\site-packages'
          & (Join-Path $target 'python.exe') -m pip install --no-cache-dir --target $site -r "$env:TBUILD\$env:REPO_NAME\heartgram-tools\python-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Secrets.
        if: env.ONLY_CACHE == 'false'
        shell: bash
        env:
          BADGE_SECRETS_H: ${{ secrets.BADGE_SECRETS_H }}
        run: |
          if [ -n "$BADGE_SECRETS_H" ]; then
            printf '%s\n' "$BADGE_SECRETS_H" > "$TBUILD/$REPO_NAME/Telegram/SourceFiles/ayu/features/project_badges/badge_secrets.h"
          fi

      - name: HeartGram build.
        if: env.ONLY_CACHE == 'false'
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          -G "Ninja Multi-Config" ^
          qt6 ^
          -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
          -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: HeartGram compile.
        if: env.ONLY_CACHE == 'false'
        shell: pwsh
        run: |
          # The log goes to a file too: a crashed runner loses the live log.
          cd "$env:TBUILD\$env:REPO_NAME\Telegram"
          cmake --build ..\out --config Release --parallel -- -k 0 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build.log"
          exit $LASTEXITCODE

      - name: Upload build log.
        if: always() && env.ONLY_CACHE == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}\build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Pack.
        if: env.ONLY_CACHE == 'false'
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release"
          $dir = New-Item -ItemType Directory -Force 'HeartGram-windows-x64'
          Copy-Item (Join-Path $out 'HeartGram.exe') $dir
          if (Test-Path (Join-Path $out 'Updater.exe')) { Copy-Item (Join-Path $out 'Updater.exe') $dir }
          Copy-Item -Recurse (Join-Path $out 'python') (Join-Path $dir 'python')
          Compress-Archive -Path $dir -DestinationPath 'HeartGram-windows-x64.zip' -Force

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.ONLY_CACHE == 'false'
        with:
          name: HeartGram-windows-x64
          path: HeartGram-windows-x64.zip
          retention-days: 7

  linux:
    name: Linux x64
    if: inputs.linux == true
    runs-on: ubuntu-latest

    env:
      ONLY_CACHE: ${{ inputs.only_cache == true && 'true' || 'false' }}
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Save Docker libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}

      - name: Restore compiler cache.
        id: cache-ccache
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-heartgram-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-heartgram-ccache-

      - name: Secrets.
        if: env.ONLY_CACHE == 'false'
        env:
          BADGE_SECRETS_H: ${{ secrets.BADGE_SECRETS_H }}
        run: |
          if [ -n "$BADGE_SECRETS_H" ]; then
            printf '%s\n' "$BADGE_SECRETS_H" > Telegram/SourceFiles/ayu/features/project_badges/badge_secrets.h
          fi

      - name: HeartGram build.
        if: env.ONLY_CACHE == 'false'
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p "$CCACHE_DIR"
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          -e KEEP_GOING=1 \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D TDESKTOP_API_ID=$TDESKTOP_API_ID \
          -D TDESKTOP_API_HASH=$TDESKTOP_API_HASH \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Save compiler cache.
        if: always() && env.ONLY_CACHE == 'false'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-heartgram-ccache-${{ github.run_id }}

      - name: Pack.
        if: env.ONLY_CACHE == 'false'
        run: |
          binary=$(find out -type f -name HeartGram | head -1)
          test -n "$binary" || { echo "Build error, output file does not exist."; exit 1; }
          mkdir HeartGram-linux-x86_64
          cp "$binary" HeartGram-linux-x86_64/
          strip HeartGram-linux-x86_64/HeartGram
          tar -czf HeartGram-linux-x86_64.tar.gz HeartGram-linux-x86_64

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.ONLY_CACHE == 'false'
        with:
          name: HeartGram-linux-x86_64
          path: HeartGram-linux-x86_64.tar.gz
          retention-days: 7

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HeartGram-windows-x64.zip
          body_path: RELEASE_NOTES.md
